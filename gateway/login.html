<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>lzr1-panel remote</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.4 ui-monospace, Menlo, monospace;
         background: #111; color: #ddd; }
  form { width: min(22rem, calc(100vw - 2rem)); display: grid; gap: .75rem; }
  h1 { font-size: 1.1rem; margin: 0; }
  p { margin: 0; color: #999; overflow-wrap: anywhere; }
  .err { color: #f77; }
  input, button { font: inherit; padding: .6rem .7rem; border-radius: 6px; border: 1px solid #444; background: #1b1b1b; color: inherit; }
  button { background: #2d6cdf; border-color: #2d6cdf; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<form method="post" action="login" autocomplete="off">
  <h1>lzr1-panel remote</h1>
  <p>Signed in to Tailscale as {{.Login}}</p>
  {{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
  <input type="password" name="password" aria-label="Password" placeholder="Password" required autofocus>
  <button type="submit">Open the panel</button>
</form>
</body>
</html>
